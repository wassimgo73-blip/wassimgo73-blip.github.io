<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Restaurant</title>
  <meta name="description" content="">
  <meta name="theme-color" content="#2f4a3a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='%232f4a3a'/%3E%3Cpath d='M16 24c0-7 3-11 8-13-6 0-9 3-8 8-1-4-4-6-8-6 4 2 7 5 8 11z' fill='%23f6f2ea'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script>document.documentElement.classList.add("js");</script>
  <link rel="stylesheet" href="styles.css">
  <!-- All business content lives in config.js -->
  <script src="config.js"></script>
  <script src="main.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Aller au contenu</a>
  <div class="grain" aria-hidden="true"></div>

  <header class="topbar" id="top">
    <div class="wrap topbar__inner">
      <a class="brand" href="#top" data-bind="business.name"></a>
      <nav class="nav" aria-label="Navigation">
        <a href="#story" data-t="ui.nav.story"></a>
        <a href="#menu" data-t="ui.nav.menu"></a>
        <a href="#hours" data-t="ui.nav.hours"></a>
        <a href="#contact" data-t="ui.nav.contact"></a>
      </nav>
      <button class="lang" type="button" id="langToggle">EN</button>
      <a class="btn btn--ink btn--nav js-book" href="#" target="_blank" rel="noopener" data-t="ui.book"></a>
    </div>
  </header>

  <main id="main">
    <!-- HERO -->
    <section class="hero">
      <div class="wrap hero__grid">
        <div class="hero__copy">
          <p class="eyebrow in" style="--d:.1s"><span class="dot"></span><span data-t="hero.eyebrow"></span></p>
          <h1 class="in" style="--d:.2s" data-t="hero.title" data-rich></h1>
          <p class="hero__sub in" style="--d:.35s" data-t="business.tagline"></p>
          <div class="hero__actions in" style="--d:.5s">
            <a class="btn btn--accent js-book" href="#" target="_blank" rel="noopener">
              <span data-t="ui.book"></span>
              <span class="btn__arrow" aria-hidden="true">→</span>
            </a>
            <a class="btn btn--ghost" href="#menu" data-t="hero.ctaMenu"></a>
          </div>
          <p class="hero__today in" style="--d:.65s" id="heroToday"></p>
        </div>
        <figure class="frame hero__media in-media" id="heroMedia">
          <svg class="branch" viewBox="0 0 400 500" aria-hidden="true">
            <path class="branch__stem" d="M40 -10 C 120 80, 160 150, 210 230 S 290 380, 360 520"/>
            <path class="branch__stem" d="M210 230 C 170 260, 130 300, 110 360"/>
            <g class="branch__leaves">
              <path d="M95 60 c 30 -8 50 6 52 28 c -26 6 -46 -6 -52 -28z"/>
              <path d="M150 140 c 6 -30 28 -42 50 -34 c -6 26 -26 40 -50 34z"/>
              <path d="M175 190 c -30 -6 -48 8 -48 30 c 26 4 44 -8 48 -30z"/>
              <path d="M250 300 c 30 -10 52 4 56 26 c -26 8 -48 -4 -56 -26z"/>
              <path d="M265 360 c -28 -4 -44 12 -42 34 c 26 2 42 -12 42 -34z"/>
              <path d="M130 320 c -26 -10 -46 0 -50 22 c 24 8 44 0 50 -22z"/>
            </g>
            <g class="branch__blooms">
              <circle cx="232" cy="262" r="5"/><circle cx="244" cy="276" r="4"/><circle cx="236" cy="292" r="4.5"/><circle cx="248" cy="306" r="3.5"/><circle cx="240" cy="320" r="3"/>
              <circle cx="118" cy="372" r="4.5"/><circle cx="126" cy="388" r="3.5"/><circle cx="116" cy="402" r="3"/>
            </g>
          </svg>
          <figcaption class="frame__caption"><span data-t="ui.photoPlaceholder"></span> · <span data-t="hero.photoCaption"></span></figcaption>
        </figure>
      </div>
    </section>

    <!-- STORY -->
    <section class="section" id="story">
      <div class="wrap story">
        <figure class="frame story__media reveal" id="storyMedia">
          <svg class="branch branch--small" viewBox="0 0 400 500" aria-hidden="true">
            <path class="branch__stem" d="M-10 420 C 90 360, 180 300, 260 200 S 360 60, 420 20"/>
            <g class="branch__leaves">
              <path d="M120 360 c 4 -30 26 -44 48 -38 c -4 26 -24 42 -48 38z"/>
              <path d="M220 250 c -28 -10 -48 2 -50 24 c 24 8 44 -2 50 -24z"/>
              <path d="M300 140 c 6 -28 28 -40 50 -32 c -6 26 -26 38 -50 32z"/>
            </g>
          </svg>
          <figcaption class="frame__caption" data-t="ui.photoPlaceholder"></figcaption>
        </figure>
        <div class="reveal">
          <p class="label"><span class="label__num">01</span><span data-t="ui.sectionLabels.story"></span></p>
          <h2 data-t="story.title"></h2>
          <p class="lead" data-t="story.text"></p>
          <dl class="stats" id="stats"></dl>
        </div>
      </div>
    </section>

    <!-- MENU -->
    <section class="section section--dark" id="menu">
      <div class="wrap">
        <div class="menu__head reveal">
          <p class="label"><span class="label__num">02</span><span data-t="ui.sectionLabels.menu"></span></p>
          <h2 data-t="menu.title"></h2>
        </div>
        <div class="tabs reveal" role="tablist" id="menuTabs"></div>
        <div id="menuPanels" class="reveal"></div>
        <p class="note" data-t="menu.note"></p>
      </div>
    </section>

    <!-- GALLERY -->
    <section class="section" id="gallery">
      <div class="wrap">
        <div class="gallery__head reveal">
          <div>
            <p class="label"><span class="label__num">03</span><span data-t="ui.sectionLabels.gallery"></span></p>
            <h2 data-t="gallery.title" data-rich></h2>
          </div>
          <p class="lead" data-t="gallery.text"></p>
        </div>
        <div class="gallery reveal" id="galleryGrid"></div>
      </div>
    </section>

    <!-- HOURS + LOCATION -->
    <section class="section" id="hours">
      <div class="wrap">
        <p class="label reveal"><span class="label__num">04</span><span data-t="ui.sectionLabels.hours"></span></p>
        <div class="grid2">
          <div class="reveal">
            <h2 data-t="hours.title"></h2>
            <ul class="hours" id="hoursList"></ul>
          </div>
          <div class="reveal" id="location">
            <h2 data-t="location.title"></h2>
            <a class="map" id="mapLink" href="#" target="_blank" rel="noopener">
              <svg class="map__streets" viewBox="0 0 400 250" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
                <path d="M-10 70 C 80 60, 160 90, 240 80 S 360 50, 410 60"/>
                <path d="M-10 170 C 100 180, 200 150, 300 165 S 380 190, 410 185"/>
                <path d="M120 -10 C 130 60, 110 140, 130 260"/>
                <path d="M290 -10 C 280 80, 300 160, 285 260"/>
                <path class="minor" d="M-10 120 L 410 115"/>
                <path class="minor" d="M200 -10 L 210 260"/>
              </svg>
              <span class="map__pin">
                <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></svg>
              </span>
              <span class="map__label" data-t="ui.mapPlaceholder"></span>
            </a>
            <p class="address" data-bind="contact.address"></p>
            <p class="muted" data-t="location.access"></p>
            <a class="link-arrow" id="mapButton" href="#" target="_blank" rel="noopener"><span data-t="location.mapButton"></span> <span aria-hidden="true">↗</span></a>
          </div>
        </div>
      </div>
    </section>

    <!-- REVIEWS -->
    <section class="section section--surface" id="reviews">
      <div class="wrap">
        <div class="reviews__head reveal">
          <div>
            <p class="label"><span class="label__num">05</span><span data-t="ui.sectionLabels.reviews"></span></p>
            <h2 data-t="reviews.title"></h2>
          </div>
          <p class="disclaimer" data-t="reviews.disclaimer"></p>
        </div>
        <div class="reviews" id="reviewList"></div>
      </div>
    </section>

    <!-- CONTACT -->
    <section class="section" id="contact">
      <div class="wrap contact">
        <div class="reveal">
          <p class="label"><span class="label__num">06</span><span data-t="ui.sectionLabels.contact"></span></p>
          <h2 data-t="contactSection.title"></h2>
          <p class="lead" data-t="contactSection.text"></p>
          <a class="btn btn--accent js-book" href="#" target="_blank" rel="noopener">
            <span data-t="contactSection.whatsappLabel"></span>
            <span class="btn__arrow" aria-hidden="true">→</span>
          </a>
        </div>
        <dl class="contact__list reveal">
          <div><dt data-t="contactSection.phoneLabel"></dt><dd><a id="phoneLink" href="#"></a></dd></div>
          <div><dt data-t="contactSection.emailLabel"></dt><dd><a id="emailLink" href="#"></a></dd></div>
          <div><dt data-t="contactSection.addressLabel"></dt><dd data-bind="contact.address"></dd></div>
        </dl>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap footer__inner">
      <p class="footer__brand" data-bind="business.name"></p>
      <p class="muted"><span data-t="business.demoNotice"></span> © <span id="year"></span> <span data-t="ui.rights"></span></p>
    </div>
  </footer>

  <!-- Sticky booking button -->
  <a class="fab js-book" href="#" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12.04 2a9.9 9.9 0 0 0-8.5 15l-1.4 5 5.1-1.34A9.92 9.92 0 1 0 12.04 2Zm0 18.13a8.2 8.2 0 0 1-4.18-1.15l-.3-.18-3.03.8.81-2.95-.2-.31a8.22 8.22 0 1 1 6.9 3.79Zm4.5-6.15c-.25-.12-1.46-.72-1.69-.8-.23-.09-.39-.13-.56.12-.16.25-.64.8-.78.97-.14.16-.29.18-.54.06a6.73 6.73 0 0 1-3.36-2.94c-.25-.44.25-.41.72-1.36.08-.16.04-.3-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.4-.41-.56-.42h-.48a.92.92 0 0 0-.66.31 2.79 2.79 0 0 0-.87 2.07 4.84 4.84 0 0 0 1.01 2.57 11.08 11.08 0 0 0 4.24 3.75c1.58.68 2.2.74 2.99.62.48-.07 1.46-.6 1.67-1.18.2-.58.2-1.08.14-1.18-.06-.1-.22-.17-.47-.29Z"/></svg>
    <span data-t="ui.book"></span>
  </a>
</body>
</html>
